            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
      responses:
        '200':
          description: Paginated health records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHealthRecords'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{userId}/personal-medical-records:
    get:
      summary: Personal medical records for a specific user
      tags: [Admin Management]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
      responses:
        '200':
          description: Paginated personal records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPersonalRecords'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/activity-logs:
    get:
      summary: List activity logs
      tags: [Admin Management]
      parameters:
        - name: action
          in: query
          schema:
            type: string
            example: LOGIN
        - name: user_id
          in: query
          schema:
            type: integer
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated activity logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActivityLogEntry'
                      total:
                        type: integer
                      per_page:
                        type: integer
                      current_page:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/integration-logs:
    get:
      summary: List integration logs (OpenMRS)
      tags: [Admin Management]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            example: SUCCESS
        - name: operation
          in: query
          schema:
            type: string
            example: PATIENT_LOOKUP
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated integration logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/IntegrationLogEntry'
                      total:
                        type: integer
                      per_page:
                        type: integer
                      current_page:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/openmrs/config:
    get:
      summary: Get OpenMRS configuration (credential never returned)
      tags: [Admin Management]
      responses:
        '200':
          description: OpenMRS config
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OpenMrsConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update OpenMRS configuration
      tags: [Admin Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint_url, credential]
              properties:
                endpoint_url:
                  type: string
                  format: uri
                  example: http://openmrs.example.com
                credential:
                  type: object
                  required: [username, password]
                  properties:
                    username:
                      type: string
                      example: admin
                    password:
                      type: string
                      format: password
                      example: Admin1234!
                is_active:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Configuration updated — credential NOT returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OpenMrsConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/openmrs/test-connection:
    post:
      summary: Test OpenMRS connection
      tags: [Admin Management]
      responses:
        '200':
          description: Connection and authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      connected:
                        type: boolean
                      authenticated:
                        type: boolean
                      status_code:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: No active config or credential invalid
        '503':
          description: Connection failed / timeout

  /admin/system-logs:
    get:
      summary: View operational system logs (sanitized)
      tags: [Admin Management]
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [emergency, alert, critical, error, warning, notice, info, debug]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Sanitized system log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            timestamp:
                              type: string
                            level:
                              type: string
                            message:
                              type: string
                      log_exists:
                        type: boolean
                      log_size_kb:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Invalid log level filter
        '429':
          description: Too many requests (throttled)

# ==========================================================
# COMPONENTS & SCHEMAS
# ==========================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  responses:
    UnauthorizedError:
      description: Unauthenticated request (Missing or invalid Sanctum Bearer token)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.

    NotFoundError:
      description: Resource not found or owned by another user
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Resource not found.

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: The given data was invalid.
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully.
        data:
          nullable: true

    UserProfile:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          example: budi@example.com
        gender:
          type: string
          nullable: true
          example: MALE
        date_of_birth:
          type: string
          format: date
          nullable: true
          example: "1995-08-17"
        avatar_url:
          type: string
          example: http://localhost/api/avatar/default?name=Budi+Santoso
        email_verification_pending:
          type: boolean
          example: false

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Authentication successful.
        data:
          type: object
          properties:
            token:
              type: string
              example: "1|abcdef1234567890..."
            user:
              $ref: '#/components/schemas/UserProfile'

    HealthRecord:
      type: object
      properties:
        health_record_id:
          type: integer
          example: 101
        user_id:
          type: integer
          example: 1
        height:
          type: string
          example: "172.50"
        weight:
          type: string
          example: "68.00"
        systolic:
          type: integer
          example: 120
        diastolic:
          type: integer
          example: 80
        bmi:
          type: string
          example: "22.86"
        bmi_category:
          type: string
          enum: [RENDAH, IDEAL, BERAT_BERLEBIH]
          example: IDEAL
        bmi_message:
          type: string
          example: BMI berada dalam rentang berat badan ideal. Pertahankan pola hidup sehat.
        warning_status:
          type: string
          nullable: true
          enum: [NORMAL, ATTENTION, URGENT]
          example: NORMAL
        warning_message:
          type: string
          nullable: true
          example: No blood-pressure screening indicator was triggered by this single measurement.
        recorded_at:
          type: string
          format: date-time
          example: "2026-10-25T14:30:00.000000Z"
        recorded_date:
          type: string
          format: date
          example: "2026-10-25"

    PersonalMedicalRecord:
      type: object
      properties:
        personal_medical_record_id:
          type: integer
          example: 5
        user_id:
          type: integer
          example: 1
        visit_date:
          type: string
          format: date
          example: "2026-10-20"
        facility_name:
          type: string
          example: RS Harapan Sehat
        complaint:
          type: string
          example: Nyeri kepala berdenyut sejak 2 hari lalu
        medications:
          type: string
          nullable: true
          example: Paracetamol 500mg 3x1
        source:
          type: string
          example: USER_REPORTED
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DashboardData:
      type: object
      properties:
        period:
          type: string
          example: month
        profile:
          $ref: '#/components/schemas/UserProfile'
        summary:
          type: object
          properties:
            latest_bmi:
              type: object
              nullable: true
              properties:
                health_record_id:
                  type: integer
                  example: 101
                bmi:
                  type: string
                  example: "22.86"
                bmi_category:
                  type: string
                  example: IDEAL
                bmi_message:
                  type: string
                height:
                  type: string
                  example: "172.50"
                weight:
                  type: string
                  example: "68.00"
                recorded_date:
                  type: string
                  example: "2026-10-25"
            latest_blood_pressure:
              type: object
              nullable: true
              properties:
                health_record_id:
                  type: integer
                  example: 101
                systolic:
                  type: integer
                  example: 120
                diastolic:
                  type: integer
                  example: 80
                warning_status:
                  type: string
                  example: NORMAL
                warning_message:
                  type: string
                recorded_date:
                  type: string
                  example: "2026-10-25"
            latest_warning:
              type: object
              nullable: true
              properties:
                warning_status:
                  type: string
                  example: NORMAL
                warning_message:
                  type: string
                recorded_date:
                  type: string
                  example: "2026-10-25"
            total_assessments:
              type: integer
              example: 4
            last_recorded_date:
              type: string
              nullable: true
              example: "2026-10-25"
        charts:
          type: object
          properties:
            bmi_trend:
              type: array
              items:
                type: object
                properties:
                  health_record_id:
                    type: integer
                  bmi:
                    type: string
                  bmi_category:
                    type: string
                  recorded_date:
                    type: string
            blood_pressure_trend:
              type: array
              items:
                type: object
                properties:
                  health_record_id:
                    type: integer
                  systolic:
                    type: integer
                  diastolic:
                    type: integer
                  warning_status:
                    type: string
                  recorded_date:
                    type: string

    CalorieEstimationResult:
      type: object
      properties:
        image:
          type: string
          description: Temporary signed URL (expires in 24h)
          example: http://localhost/api/calorie-estimation/image/uuid.jpg?expires=1762345678&signature=...
        image_url:
          type: string
        title:
          type: string
          example: Hasil Estimasi
        total_calories_min:
          type: integer
          example: 470
        total_calories_max:
          type: integer
          example: 595
        total_calories_formatted:
          type: string
          example: "~470–595 kkal"
        is_mock:
          type: boolean
          example: true
        simulation_label:
          type: string
          example: Data Simulasi (Mock)
        disclaimer:
          type: string
          example: Hasil estimasi kalori ini merupakan data simulasi dan belum dianalisis oleh model AI medis sungguhan.
        foods:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Ikan Salmon Panggang
              calories_min:
                type: integer
                example: 220
              calories_max:
                type: integer
                example: 250
              calories_formatted:
                type: string
                example: 220–250 kkal

    PaginatedHealthRecords:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            data:
              type: array
              items:
                $ref: '#/components/schemas/HealthRecord'
            total:
              type: integer
              example: 42
            per_page:
              type: integer
              example: 15

    PaginatedPersonalRecords:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            data:
              type: array
              items:
                $ref: '#/components/schemas/PersonalMedicalRecord'
            total:
              type: integer
              example: 12
            per_page:
              type: integer
              example: 15

    AdminUserSafe:
      type: object
      description: User object with PII fields removed for admin consumption.
      properties:
        user_id:
          type: integer
          example: 1
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@example.com
        gender:
          type: string
          nullable: true
          example: L
        date_of_birth:
          type: string
          format: date
          nullable: true
          example: "1990-01-15"
        avatar_url:
          type: string
          example: http://localhost/api/avatar/default?name=Budi+Santoso
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        email_verification_pending:
          type: boolean
          example: false
        role:
          type: string
          example: USER
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ActivityLogEntry:
      type: object
      properties:
        activity_id:
          type: integer
          example: 42
        user_id:
          type: integer
          nullable: true
          example: 7
        action:
          type: string
          example: LOGIN
        description:
          type: string
          nullable: true
          example: User logged in via email/password.
        created_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AdminUserSafe'

    IntegrationLogEntry:
      type: object
      properties:
        log_id:
          type: integer
          example: 5
        user_id:
          type: integer
          nullable: true
          example: 3
        operation:
          type: string
          example: PATIENT_LOOKUP
        status:
          type: string
          example: SUCCESS
        attempted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AdminUserSafe'

    OpenMrsConfigResponse:
      type: object
      description: OpenMRS configuration. Credential/password fields are NEVER returned.
      properties:
        config_id:
          type: integer
          example: 1
        endpoint_url:
          type: string
          format: uri
          example: http://openmrs.example.com
        is_active:
          type: boolean
          example: true
        updated_by:
          type: integer
          nullable: true
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

